<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #e3f2fd, #fce4ec);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .dashboard {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      animation: fadeIn 0.5s ease-in-out;
    }

    .dashboard-header {
      background: linear-gradient(135deg, #42a5f5, #ec407a);
      padding: 30px 20px 50px;
      text-align: center;
      color: white;
      position: relative;
    }

    .profile-photo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #fff;
      object-fit: cover;
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .dashboard-body {
      padding: 80px 20px 30px;
      text-align: center;
    }

    .username {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }

    .useremail,
    .usermobile {
      font-size: 14px;
      color: #777;
      margin-bottom: 2px;
    }

    .menu {
      list-style: none;
      padding: 0;
      margin: 30px 0;
      text-align: left;
    }

    .menu li {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .menu li:hover {
      background-color: #f9f9f9;
      transform: translateX(5px);
    }

    .menu li span {
      margin-left: 10px;
    }

    .logout-btn {
      background: #e91e63;
      border: none;
      padding: 10px 25px;
      color: white;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .logout-btn:hover {
      background-color: #d81b60;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .dashboard {
        margin: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="dashboard-header">
      <h2>User Profile</h2>
      <img src="/static/images/userpic.jpg" alt="Profile Photo" class="profile-photo" />
    </div>

    <div class="dashboard-body">
      <div class="username">{{ name }}</div>
      <div class="useremail">{{ email }}</div>
      <div class="usermobile">{{ mobile }}</div>

      <ul class="menu">
        <li><span>🛍️</span><span>Order History</span></li>
        <li><span>💖</span><span>Wishlist</span></li>
        <li><span>👗</span><span>Saved Outfits</span></li>
        <li><span>🎨</span><span>Style Preferences</span></li>
        <li><span>⚙️</span><span>Edit Profile</span></li>
      </ul>

      <a href="{{ url_for('logout') }}">
        <button class="logout-btn">Logout</button>
      </a>
    </div>
  </div>
</body>
</html>
