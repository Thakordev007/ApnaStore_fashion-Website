<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { min-height: 100vh; background: linear-gradient(135deg,#eef2ff,#f8fafc); display: flex; justify-content: center; align-items: center; padding: 1rem; }
    .login-container { width: 100%; max-width: 430px; background: #fff; padding: 2rem; border-radius: 14px; box-shadow: 0 14px 32px rgba(30,41,59,.14); }
    .login-form h2 { margin-bottom: 8px; color: #0f172a; text-align: center; }
    .login-form p { margin-bottom: 16px; color: #475569; text-align: center; }
    .flash-list { list-style: none; margin-bottom: 12px; }
    .flash-list li { padding: .7rem .85rem; border-radius: 8px; margin-bottom: 8px; font-size: .92rem; background: #fef3c7; color: #92400e; }
    .login-form label { display: block; margin: 10px 0 5px; color: #334155; font-weight: 600; }
    .login-form input { width: 100%; padding: 11px; margin-bottom: 14px; border-radius: 8px; border: 1px solid #cbd5e1; }
    .login-form input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59,130,246,.18); }
    .login-form button { width: 100%; padding: 12px; background: linear-gradient(90deg,#2563eb,#4f46e5); color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .login-form button:hover { opacity: 0.95; }
    .extra-links { text-align: center; margin-top: 14px; font-size: 14px; color: #475569; }
    .extra-links a { color: #2563eb; text-decoration: none; font-weight: 600; }
    @media (max-width: 480px) { .login-container { padding: 1.3rem; } }
  </style>
</head>
<body>

  <div class="login-container">
    <form id="loginForm" class="login-form" action="/login" method="post">
      <h2>Welcome Back!</h2>
      <p>Login to your account</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="flash-list">
            {% for category, message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" name="password" required>

      <button type="submit">Login</button>
      <div class="extra-links">
        New user? <a href="{{ url_for('signup') }}">Create account</a>
      </div>
    </form>
  </div>

</body>
</html>
