<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - Apna Store</title>
  <style>
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg,#eef2ff,#f8fafc); margin: 0; padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .contact-form-container { width: 100%; max-width: 620px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 14px 30px rgba(15,23,42,.14); }

    h2 { text-align: center; color: #1f2937; margin-bottom: 20px; }

    .form-group {
      margin-bottom: 15px;
    }

    label { display: block; font-weight: bold; margin-bottom: 5px; color: #334155; }

    input, textarea { width: 100%; padding: 11px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
    input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.18); }

    textarea {
      resize: vertical;
    }

    button { width: 100%; padding: 12px; background: linear-gradient(90deg,#2563eb,#4f46e5); color: white; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; }

    button:hover { opacity: .95; }

    .back-link { margin-top: 14px; text-align: center; }
    .back-link a { color: #2563eb; font-weight: 600; text-decoration: none; }
    @media (max-width: 480px) { .contact-form-container { padding: 20px 16px; } }
  </style>
</head>
<body>
  <div class="contact-form-container ">
    <h2>Contact Us</h2>
    <form id="contactForm" action="/contact" method="post">
      <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required />
      </div>
      
      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="subject">Subject *</label>
        <input type="text" id="subject" name="subject" required />
      </div>

      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit">Send Message</button>
      <div class="back-link"><a href="{{ url_for('home') }}">Back to Home</a></div>
    </form>
  </div>

  

</body>
</html>
