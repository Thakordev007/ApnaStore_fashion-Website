<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { min-height: 100vh; background: linear-gradient(135deg,#ecfeff,#eef2ff); display: flex; justify-content: center; align-items: center; padding: 1rem; }
    .signup-container { width: 100%; max-width: 440px; background: #fff; padding: 2rem; border-radius: 14px; box-shadow: 0 14px 32px rgba(30,41,59,.14); }
    .signup-form h2 { margin-bottom: 8px; color: #0f172a; text-align: center; }
    .signup-form p { margin-bottom: 16px; color: #475569; text-align: center; }
    .flash-list { list-style: none; margin-bottom: 12px; }
    .flash-list li { padding: .7rem .85rem; border-radius: 8px; margin-bottom: 8px; font-size: .92rem; background: #fef3c7; color: #92400e; }
    .signup-form label { display: block; margin: 10px 0 5px; color: #334155; font-weight: 600; }
    .signup-form input { width: 100%; padding: 11px; margin-bottom: 14px; border-radius: 8px; border: 1px solid #cbd5e1; }
    .signup-form input:focus { border-color: #22c55e; outline: none; box-shadow: 0 0 0 3px rgba(34,197,94,.16); }
    .signup-form button { width: 100%; padding: 12px; background: linear-gradient(90deg,#16a34a,#22c55e); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .signup-form button:hover { opacity: .95; }
    .extra { margin-top: 14px; text-align: center; color: #475569; font-size: 14px; }
    .extra a { color: #2563eb; font-weight: 600; text-decoration: none; }
    @media (max-width: 480px) { .signup-container { padding: 1.3rem; } }
  </style>
</head>
<body>

  <div class="signup-container">
    <form id="signupForm" class="signup-form" method="POST" action="{{ url_for('signup') }}">
      <h2>Create Account</h2>
      <p>Sign up to get started</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="flash-list">
            {% for category, message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Create a password" name="password" required>

      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" placeholder="Enter mobile number" name="mobile" required>

      <button type="submit">Sign Up</button>
      <p class="extra">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </form>
  </div>

</body>
</html>
